<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinema Seat Manager</title>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-6 p-6">
      <h1 class="text-4xl font-bold tracking-tight">Cinema Seat Manager 🎬</h1>

      <section class="w-full rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
        <div class="mb-4 text-center">
          <h2 class="text-lg font-semibold text-slate-900">Sala de cine — 8 filas × 10 asientos</h2>
          <p id="app" class="mt-1 text-sm text-slate-600"></p>
        </div>

        <div id="seat-grid" class="grid grid-cols-[auto_repeat(10,2.5rem)] gap-1.5 justify-center"></div>

        <div class="mt-6 flex items-center justify-center gap-6 text-sm">
          <span class="flex items-center gap-2">
            <span class="inline-block h-4 w-4 rounded bg-emerald-400"></span> Disponible
          </span>
          <span class="flex items-center gap-2">
            <span class="inline-block h-4 w-4 rounded bg-red-500"></span> Ocupado
          </span>
        </div>

        <div class="mt-4 grid grid-cols-2 gap-4 text-center">
          <div class="rounded-xl bg-slate-50 p-4">
            <p class="text-3xl font-bold text-red-500"><span id="occupied-count">0</span></p>
            <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Ocupados</p>
          </div>
          <div class="rounded-xl bg-slate-50 p-4">
            <p class="text-3xl font-bold text-emerald-500"><span id="available-count">0</span></p>
            <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Disponibles</p>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
